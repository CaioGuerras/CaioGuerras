<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Caio Guerras">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07060a"/><stop offset="1" stop-color="#15111d"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.78" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#9333ea" stop-opacity=".45"/><stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roxo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/><stop offset=".35" stop-color="#c084fc"/><stop offset=".75" stop-color="#9333ea"/><stop offset="1" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="claro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="luz" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b"/>
      <feFlood flood-color="#a855f7" flood-opacity=".55"/><feComposite in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a855f7" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1280" height="300" rx="22" fill="url(#fundo)"/>
  <rect width="1280" height="300" rx="22" fill="url(#grade)"/>
  <rect width="1280" height="300" rx="22" fill="url(#brilho)"/>
  <g transform="translate(70 50) scale(0.2)">
   <g filter="url(#luz)">
    <animate attributeName="opacity" values=".85;1;.85" dur="3.2s" repeatCount="indefinite"/>
    <path d="M760.9 281.0A340 340 0 1 0 760.9 719.0" fill="none" stroke="url(#roxo)" stroke-width="128" stroke-linecap="round"/>
    <path d="M452 368L452 632L668 500Z" fill="url(#claro)" stroke="url(#claro)" stroke-width="54" stroke-linejoin="round"/>
   </g>
  </g>
  <text x="300" y="138" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="800" fill="url(#claro)" letter-spacing="-1.5">Caio Guerras</text>
  <text x="302" y="186" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#c084fc">Self-hosting · automação · IA aplicada no dia a dia</text>
  <text x="302" y="226" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" fill="#a99bc0">~/macaé $ não manjo, tô aqui de teimosia_</text>
</svg>
